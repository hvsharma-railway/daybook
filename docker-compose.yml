services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: daybook
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "32769:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "32770:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: user
      PMA_PASSWORD: password
    depends_on:
      - db

  # New Daybook application (Python) - see daybook_app/README.md
  app:
    build: ./daybook_app
    ports:
      - "32771:8000"
    volumes:
      - ./daybook_app:/app
    environment: &app_env
      DATABASE_URL: mysql+pymysql://user:password@db:3306/daybook?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      DAYBOOK_SECRET_KEY: ${DAYBOOK_SECRET_KEY:-dev-only-change-me}
      IPAS_BASE_URL: ${IPAS_BASE_URL:-https://aims.indianrailways.gov.in}
    command: sh -c "alembic upgrade head && uvicorn daybook.web.app:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - db
      - redis

  worker:
    build: ./daybook_app
    volumes:
      - ./daybook_app:/app
    environment: *app_env
    command: rq worker --url redis://redis:6379/0 daybook
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  db_data: