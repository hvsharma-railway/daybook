<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Daybook {{ ym }} Allocation {{ allocation }}</title>
<style>
  @page { size: A4 landscape; margin: 8mm; @bottom-right { content: "Page " counter(page) " of " counter(pages); font-size: 7pt; } }
  body { font-family: "DejaVu Sans", Arial, sans-serif; margin: 0; }
  .print-part { page-break-after: always; }
  .dbt-title { font-size: 11pt; margin: 0 0 5px; }
  .dbt { border-collapse: collapse; }
  .dbt-print { table-layout: fixed; }
  .dbt th, .dbt td { border: 1px solid #000; padding: 1px 3px; vertical-align: top; }
  .dbt th { background: #eee; } .num { text-align: right; white-space: nowrap; }
  .wrap { overflow-wrap: anywhere; } .nowrap { white-space: nowrap; }
  thead { display: table-header-group; } tr { page-break-inside: avoid; }
  .daybook-summary { font-size: 10pt; } .daybook-summary .dbt td, .daybook-summary .dbt th { padding: 4px 8px; }
  .cs-mark { font-size: 8pt; font-weight: normal; padding: 0 4px; border-radius: 3px; }
  .cs-mark.ok { color: #0a6b2e; background: #d9f2e2; } .cs-mark.bad { color: #a01624; background: #fbdde0; } .cs-mark.none { color: #666; }
  .cs-hit { background: #c8efd5 !important; } .cs-miss { background: #f9c9cf !important; }
  .signatures { display: flex; justify-content: space-between; width: 70%; margin-top: 70px; }
</style></head>

</body></html>
