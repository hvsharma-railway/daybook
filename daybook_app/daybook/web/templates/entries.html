{% extends "base.html" %}
{% block title %}Entries{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Entries</h1>
  {% if table %}{% include "_exports.html" %}{% endif %}
</div>
<form method="get" class="card mb-3"><div class="card-body row g-2 align-items-end">
  <div class="col-6 col-md-2"><label class="form-label small">From month</label><input type="month" name="from" value="{{ filters.get('from', '') }}" class="form-control form-control-sm"></div>
  <div class="col-6 col-md-2"><label class="form-label small">To month</label><input type="month" name="to" value="{{ filters.get('to', '') }}" class="form-control form-control-sm"></div>
  <div class="col-6 col-md-1"><label class="form-label small">Allocation</label>
    <select name="allocation" class="form-select form-select-sm"><option value="">All</option>{% for a in allocations %}<option {{ 'selected' if filters.get('allocation') == a }}>{{ a }}</option>{% endfor %}</select></div>
  <div class="col-6 col-md-1"><label class="form-label small">Sub-alloc.</label><input name="code" value="{{ filters.get('code', '') }}" class="form-control form-control-sm" placeholder="20-16"></div>
  <div class="col-6 col-md-2"><label class="form-label small">UWID</label><input name="uwid" value="{{ filters.get('uwid', '') }}" class="form-control form-control-sm"></div>
  <div class="col-6 col-md-2"><label class="form-label small">CO6 / JV number</label><input name="co6" value="{{ filters.get('co6', '') }}" class="form-control form-control-sm"></div>
  <div class="col-6 col-md-2"><label class="form-label small">Party / description</label><input name="party" value="{{ filters.get('party', '') }}" class="form-control form-control-sm"></div>
  <div class="col-6 col-md-2"><label class="form-label small">Section</label><input name="section" value="{{ filters.get('section', '') }}" class="form-control form-control-sm"></div>
  <div class="col-12 col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="all" value="1" id="all" {{ 'checked' if filters.get('all') }}><label class="form-check-label small" for="all">Include rows the Daybook leaves out (SYS-GENERATED, codes 66+)</label></div></div>
  <div class="col-12 col-md-2"><button class="btn btn-primary btn-sm w-100">Search</button></div>
</div></form>
{% if table %}{% set t = table %}{% include "_table.html" %}{% else %}<div class="small-muted">Choose at least one filter.</div>{% endif %}
{% endblock %}
